name: build

# 手动触发，或打 v* 标签时自动构建三平台可执行程序并上传为 artifact。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Build executable
        run: python -m PyInstaller packaging/wps_tool.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: wps-tool-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
