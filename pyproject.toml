[project]
name = "wps-tool"
version = "0.1.0"
description = "Local PPT, PDF and DOCX processing tool (teaching scaffold)"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "pypdf>=4.0",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "pillow>=10.0",
  "httpx>=0.27",
  "pydantic-settings>=2.0",
  "loguru>=0.7",
]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "pyinstaller>=6.0",
]

[project.scripts]
wps-tool = "wps_tool.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["RUF012"]  # 可变类默认在本项目是刻意的（ABC supported_extensions、pydantic model_config）
